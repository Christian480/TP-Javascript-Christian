<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="style.css"> 
    <title>Mini-RPG</title>

</head>
<body>
    <h1>Mini-RPG</h1>

    <section id="personnage">

        <h2>Fiche du personnage</h2>

        <p>Nom: <span id="nom"></span></p>
        <p>Force: <span id="force"></span></p>
        <p>Magie: <span id="magie"></span></p>
        <p>Niveau: <span id="niveau"></span></p>
        <p>Classe: <span id="classe"></span></p>
        <p>Pièces d'or: <span id="pieces"></span></p>
        <p>Possède la clé: <span id="cle"></span></p>
        <p>Possède le chapeau: <span id="chapeau"></span></p>
    </section>

    <section id="combats">

        <h2>Combats</h2>

        <button id="fantome">Combattre le fantome</button>
        <button id="loup">Combattre le loup</button>
        <button id="paladin">Combattre le paladin</button>
    
    </section>

    <section id="marchand">

        <h2>Marchand</h2>

        <button id="acheterCle">Acheter la clé (10 pièces d'or)</button>
        <button id="acheterChapeau">Acheter le chapeau</button>
    </section>

    <section id="boss">

        <h2>Boss</h2>
        <button id="battreBoss">Battre le boss</button>
    </section>
 
    <section id="Messages">

        <h2>Messages</h2>
        <div id="messages"></div>
    </section>

    <script src="TP.js"></script>
</body>
</html>
